<!DOCTYPE html>
<html>
  <head>
    <title>Document</title>

    <!-- html을 실행시키기 위해 반드시 먼저 작성되어야 하는 자바스크립트 코드를 기술 -->
    <script>
      document.write("자바스크립트 head에 위치<br>");
    </script>
    <!--
    <script src="js_location.js"></script>
    -->
  </head>
  <body>
    <!-- HTML 코드가 작성되는 곳 -->
    <p>test</p>

    <!-- script는 body태그 최하단에 작성. html 로딩이 완료된 후에 실행하기 위함 -->
    <script>
      document.write("자바스크립트 body에 위치<br>");
      const person = {
        firstName: "John",
        lastName: "Doe",
        age: 50,
        eyeColor: "blue",
      };

      person["age"] = 51;
      person.age = 51;
      console.log(person["age"]);
      console.log(person.age);
      console.log(person);

      const cars = ["Saab", "Volvo", "BMW"];
      console.log(cars);

      console.log(typeof "John");
      console.log(typeof 3);
      console.log(typeof true);
      console.log(typeof { x: 1 });
      console.log(typeof [1]);
      console.log(typeof undefined);
      console.log(typeof null);

      console.log(0.1 + 0.2);

      let brands = ["apple", "google", "facebook", "amazon", "samsung"];
      for (let index = 0; index < brands.length; index++) {
        console.log(brands[index]);
      }

      for (const key in person) {
        if (Object.hasOwnProperty.call(person, key)) {
          console.log(person[key]);
        }
      }
      console.log("55555555555555555555555555");
      for (const brand of brands) {
        console.log(brand);
      }

      let language = "javascript";
      for (const str of language) {
        console.log(str);
      }
    </script>
    <script src="js_location.js"></script>
    <script src="internal_object.js"></script>
  </body>
</html>
